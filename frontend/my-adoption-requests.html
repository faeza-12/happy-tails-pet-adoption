<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Adoption Requests - Happy Tails</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🐾 Happy Tails
        </div>

        <div class="nav-links">
            <a href="user-dashboard.html">Dashboard</a>
            <a href="pets.html">Pets</a>
            <a href="my-adoption-requests.html" aria-current="page">My Requests</a>
        </div>

        <button
            id="logoutButton"
            class="logout-button">
            Logout
        </button>

    </nav>


    <main class="dashboard">

        <section class="dashboard-header">

            <div>

                <span class="tag">
                    MY REQUESTS
                </span>

                <h1>
                    My Adoption Requests ❤️
                </h1>

                <p>
                    Track the pets you have requested to adopt.
                </p>

            </div>

            <div class="dashboard-pet">
                🐶
            </div>

        </section>


        <section class="admin-section">

            <div class="section-heading">

                <div>

                    <span class="tag">
                        REQUEST HISTORY
                    </span>

                    <h2>
                        Your Adoption Requests
                    </h2>

                </div>

                <button
                    class="card-button"
                    onclick="loadMyRequests()">
                    🔄 Refresh
                </button>

            </div>


            <div
                id="requestList"
                class="dashboard-grid">

                <p>
                    Loading your requests... 🐾
                </p>

            </div>

        </section>

    </main>


    <script src="js/my-adoption-requests.js"></script>

</body>

</html>
