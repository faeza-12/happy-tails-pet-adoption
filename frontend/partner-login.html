<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to the Happy Tails Partner Portal to manage your shelter pets and adoption requests.">
    <title>Partner Log In - Happy Tails 🐾</title>
    
    <link rel="stylesheet" href="css/partner-minimal.css">
</head>

<body class="partner-minimal-page">

    <!-- Minimal Brand Header -->
    <header class="pm-header">
        <a href="index.html" class="pm-logo" id="partnerBrandLink">
            <span class="paw">🐾</span> Happy Tails
        </a>
        <div>
            <span class="pm-badge">Partner Portal</span>
        </div>
    </header>

    <!-- Minimal Card Container -->
    <main class="pm-card pm-card-login" id="partnerLoginCard">

        <!-- Navigation Tabs: Login / Register -->
        <nav class="pm-tabs" aria-label="Partner Portal Navigation">
            <a href="partner-login.html" class="pm-tab active" id="tabPartnerLogin" aria-current="page">Partner Log In</a>
            <a href="partner-register.html" class="pm-tab" id="tabPartnerRegister">Register Organization</a>
        </nav>

        <div class="pm-title-group">
            <h1 class="pm-title">Partner Log In</h1>
            <p class="pm-subtitle">
                Access your shelter dashboard, pet listings, and adoption requests.
            </p>
        </div>

        <form id="partnerLoginForm" novalidate>

            <!-- Email -->
            <div class="pm-field">
                <div class="pm-label-wrap">
                    <label for="email" class="pm-label">Organization Email <span class="req">*</span></label>
                </div>
                <div class="pm-input-wrap">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="pm-input" 
                        placeholder="contact@shelter.org" 
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="pm-field">
                <div class="pm-label-wrap">
                    <label for="password" class="pm-label">Password <span class="req">*</span></label>
                </div>
                <div class="pm-input-wrap">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="pm-input" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="pm-pass-toggle" id="toggleLoginPassword" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>

            <!-- Alert Message Box -->
            <div id="partnerLoginMessage" class="pm-message message" role="status" aria-live="polite"></div>

            <!-- Submit Button -->
            <button type="submit" class="pm-submit-btn" id="submitPartnerLoginBtn">
                <span>Log In to Dashboard</span>
                <span aria-hidden="true">→</span>
            </button>

        </form>

        <!-- Footer Links -->
        <div class="pm-footer-links">
            <div>
                Not registered yet? 
                <a href="partner-register.html" id="linkToPartnerRegister">Apply as a Shelter Partner</a>
            </div>
            <div>
                Adopter or general user? 
                <a href="login.html" id="linkToUserLogin">General User Log In</a>
            </div>
        </div>

    </main>

    <a href="index.html" class="pm-back">← Back to Happy Tails Home</a>

    <script src="js/partner-login.js"></script>
</body>
</html>
