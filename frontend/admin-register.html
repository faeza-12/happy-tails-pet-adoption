<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration - Happy Tails</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            🐾 Happy Tails
        </div>

        <div class="auth-card">

            <div class="auth-header">

                <div class="big-icon">
                    👑
                </div>

                <span class="tag">
                    ADMIN ACCESS
                </span>

                <h1>
                    Admin Registration
                </h1>

                <p>
                    Create an administrator account
                </p>

            </div>


            <form id="adminRegisterForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10 digit phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminCode">
                        Admin Authorization Code
                    </label>

                    <input
                        type="password"
                        id="adminCode"
                        name="adminCode"
                        placeholder="Enter admin code"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button full-width">

                    Create Admin Account 👑

                </button>


                <div
                    id="adminRegisterMessage"
                    class="message">
                </div>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </div>


            <div class="auth-footer">

                Not an administrator?

                <a href="register.html">
                    Create a user account
                </a>

            </div>

        </div>


        <a href="index.html"
           class="back-home">

            ← Back to Home

        </a>

    </div>


    <script src="js/admin-register.js"></script>

</body>

</html>
