<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Happy Tails</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            🐾 Happy Tails
        </div>

        <div class="auth-card">

            <div class="auth-header">

                <div class="big-icon">
                    😻
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your Happy Tails account
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-button full-width">

                    Login 🐾

                </button>

                <div id="loginMessage"
                     class="message">
                </div>

            </form>

            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create one here
                </a>

            </div>
            <p class="auth-footer">Shelter or rescue organization? <a href="partner-login.html">Partner Login</a> · <a href="partner-register.html">Register</a></p>

        </div>

        <a href="index.html"
           class="back-home">
            ← Back to Home
        </a>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
